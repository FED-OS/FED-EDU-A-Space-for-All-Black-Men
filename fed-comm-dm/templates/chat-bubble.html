<!--
  FED-EDU :: fed-comm-dm :: templates/chat-bubble.html
  The ONE message bubble. Copy this pattern, don't re-invent it.
  chat-engine.js render() builds this exact shape for every message.

  WHY A TEMPLATE FILE?
  The engine writes HTML with plain JavaScript (no framework — ADR-001).
  If the bubble look changes, it changes HERE first, then the engine copies it.
  One source of truth beats two.

  THE RULES (read before you touch it):
  1. escapeHTML() runs BEFORE anything lands in text/sig — no raw HTML in messages.
     That's how we keep a brother from "accidentally" dropping a script tag in a DM.
  2. class="dm-bubble me" = sent from THIS device. class="dm-bubble them" = the brother.
  3. The cipher never renders. What renders is the OPENED box (plain text again).
  4. No tracking pixels, no read-receipts, no "typing..." spyware. We didn't build that.
     A brother reads when he reads. (Six Rules, Rule 3: real ones move in daylight.)
-->

<!-- ===== A BUBBLE THE BROTHER SENT (them) ===== -->
<article class="dm-bubble them" data-sender="them">
  <!-- data-* attributes = the engine's filing system. Don't delete, don't rename. -->
  <time class="dm-time" datetime="2026-01-15T21:04:00Z" data-timestamp="1770000000000">
    9:04 PM
  </time>
  <!--
    The message body. Plain text ONLY after escapeHTML().
    If you're seeing &lt;script&gt; instead of a running script — that's the armor working.
  -->
  <p class="dm-text" data-field="text">Yo — I got the tether working on the PC. We online from the crib now.</p>
  <span class="dm-sig" data-field="sig" title="Signature stamp — proves the passphrase opened the same box both sides">
    ✅ opened 9:04 PM · passphrase check passed
  </span>
</article>

<!-- ===== A BUBBLE YOU SENT (me) ===== -->
<article class="dm-bubble me" data-sender="me">
  <time class="dm-time" datetime="2026-01-15T21:06:00Z" data-timestamp="1770000120000">
    9:06 PM
  </time>
  <p class="dm-text" data-field="text">Salute. Get the refurb raffle ticket in — that tower is your ticket out the group chat era.</p>
  <span class="dm-sig" data-field="sig" title="Sent from this device — locked with the shared passphrase">
    🔒 locked 9:06 PM · AES-GCM
  </span>
</article>

<!--
  HOW THE ENGINE USES THIS PATTERN (from chat-engine.js render()):

      html += '<div class="dm-bubble ' + (mine ? "me" : "them") + '">'
           +   escapeHTML(msg.text)
           + '</div>';

  When you upgrade the bubble (add avatars, add day dividers, add emojis),
  do it HERE in markup, then mirror it in render() with the same class names.
  Then bump CACHE_VERSION in service-worker.js so phones pick up the new look.
  (That's the ritual — CACHE_VERSION is on you. Miss it and brothers see last month's app.)

  STYLE NOTES — the look lives in core-system/styles.css:
  .dm-bubble.me    → pinned right, forest green edge
  .dm-bubble.them  → pinned left, plain background
  data-saver class on <html> flips the whole app to light mode for metered 3G brothers.

  A WORD ON WHAT WE DON'T ADD:
  No "seen ✓✓." No typing dots. No screenshot alerts. No read receipts.
  That's surveillance culture wearing a friendly mask — not our culture.
  You'll know he read it when he answers. Same as it always was on the block.

  Your Move: paste this pattern into your own FED-EDU project and you already
  know how every DM in the ecosystem is built. That's a transferable skill.
-->
