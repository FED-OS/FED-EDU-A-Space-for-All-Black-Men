# FED-EDU Leaderboard Sync — the stats wall never goes stale
# Runs daily + on merges. Counts commits, PRs, tickets, and daps across the org,
# then writes the refreshed JSON that the leaderboard page reads.
# Plain terms: this is the scoreboard crew. It tallies the game nightly.

name: Leaderboard Sync

on:
  schedule:
    - cron: '30 4 * * *'   # 4:30 AM UTC daily — after the block sleeps
  push:
    branches: [main]
    paths:
      - 'excellence-matrix/**'
      - 'hustle-index/**'
      - 'physical-raffles/earn-tickets.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull up
        uses: actions/checkout@v4

      - name: Tally the block (recount from GitHub's own numbers)
        uses: actions/github-script@v7
        with:
          script: |
            // Recount from the source of truth (GitHub itself) — never trust stale JSON.
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });

            // Tally PRs per brother (merged = shipped)
            const tally = {};
            for (const pr of prs) {
              const u = pr.user.login;
              tally[u] = tally[u] || { prs: 0, merged: 0, issues: 0, ships: 0, tickets: 0 };
              tally[u].prs += 1;
              if (pr.merged_at) {
                tally[u].merged += 1;
                tally[u].tickets += 5; // rate from physical-raffles/
              }
            }

            // Tally issues (bugs = QA work, ships = showcase)
            for (const i of issues) {
              if (i.pull_request) continue;
              const u = i.user.login;
              tally[u] = tally[u] || { prs: 0, merged: 0, issues: 0, ships: 0, tickets: 0 };
              tally[u].issues += 1;
              if (i.title.startsWith('[SHIP]')) {
                tally[u].ships += 1;
                tally[u].tickets += 10;
              }
              if (i.title.startsWith('[BUG]') && i.state === 'closed') {
                tally[u].tickets += 3; // bug reports with receipts = QA work
              }
            }

            // Known-agent accounts don't compete (AGENTS.md)
            const agents = ['fedpromptly-agent', 'github-actions[bot]', 'actions-user'];

            const brothers = Object.entries(tally)
              .filter(([name]) => !agents.includes(name))
              .map(([name, s]) => ({
                name,
                prs: s.prs,
                merged: s.merged,
                issues: s.issues,
                ships: s.ships,
                tickets: s.tickets,
                level: s.merged >= 10 ? 'OG' : s.merged >= 5 ? 'Certified Builder' : s.merged >= 1 ? 'Builder' : 'Fresh Spawn'
              }))
              .sort((a, b) => b.tickets - a.tickets || b.merged - a.merged);

            const board = {
              updated: new Date().toISOString(),
              note: "Auto-tallied nightly by leaderboard_sync. Counts come from GitHub itself — never hand-edited (see AGENTS.md).",
              totalTicketsOutstanding: brothers.reduce((sum, b) => sum + b.tickets, 0),
              brothers: brothers
            };

            const fs = require('fs');
            fs.writeFileSync('community-boards/leaderboard.json', JSON.stringify(board, null, 2));
            console.log(`✅ Tallied ${brothers.length} brothers. Top of the board: ${brothers[0] ? brothers[0].name + ' (' + brothers[0].tickets + ' tickets)' : 'nobody yet — be the first'}`);

      - name: Commit the fresh board (if it changed)
        run: |
          git config user.name "FED-EDU StatBot"
          git config user.email "actions@github.com"
          git add community-boards/leaderboard.json
          if git diff --cached --quiet; then
            echo "No changes — board already current."
          else
            git commit -m "chore: nightly leaderboard tally [skip-ci]"
            git push
            echo "✅ Board synced."
          fi

      - name: Plain-terms report
        run: |
          echo "============================================"
          echo "  LEADERBOARD SYNC REPORT"
          echo "============================================"
          echo "Scoreboard crew ran clean."
          echo "Counts: PRs, issues, ships, and tickets — straight from GitHub."
          echo "Next raffle drawing: see physical-raffles/earn-tickets.json"
          echo "One commit at a time. 🏁"
