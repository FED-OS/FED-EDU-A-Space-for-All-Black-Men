<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FED-EDU Hustle Index — the commission board, member market, and rate floor law. Brothers bring client leads, brothers ship them, 100% of the money goes to the brother who ships. Phone-first, offline-capable.">
  <title>Hustle Index — FED-EDU</title>
  <style>
    :root {
      --green: #00ff66;
      --bg: #0a0a0a;
      --panel: #111111;
      --line: #222222;
      --text: #e8e8e8;
      --dim: #888888;
      --gold: #ffbb33;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Courier New", monospace;
      line-height: 1.55;
      max-width: 760px;
      margin: 0 auto;
      padding: 12px;
    }
    header {
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 14px;
      margin-bottom: 12px;
    }
    header h1 {
      color: var(--green);
      font-size: 1.15rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    header .sub { color: var(--dim); font-size: 0.8rem; margin-top: 4px; }

    /* nav */
    #hustle-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    #hustle-nav button {
      flex: 1 1 auto;
      font-family: inherit;
      font-size: 0.78rem;
      color: var(--dim);
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 10px 8px;
      min-height: 42px;
      cursor: pointer;
      white-space: nowrap;
    }
    #hustle-nav button.active { color: var(--green); border-color: var(--green); }

    /* the law banner */
    .floor-banner {
      border: 1px solid var(--gold);
      background: #141005;
      color: var(--gold);
      font-size: 0.78rem;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .floor-banner .fine { color: #b08a2e; font-size: 0.7rem; }

    .card {
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 14px;
      margin-bottom: 12px;
    }
    .view-title {
      color: var(--green);
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .brief { color: var(--dim); font-size: 0.85rem; }

    /* commission cards */
    .com-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.72rem;
    }
    .com-id { color: var(--dim); }
    .chip {
      display: inline-block;
      border: 1px solid var(--line);
      color: var(--dim);
      font-size: 0.68rem;
      padding: 2px 8px;
      text-transform: uppercase;
    }
    .chip.open { color: var(--green); border-color: var(--green); }
    .chip.paid { color: var(--gold); border-color: var(--gold); }
    .chip.cancelled { color: #ff4444; border-color: #ff4444; text-decoration: line-through; }
    .commission h3 { color: var(--text); font-size: 1rem; margin-bottom: 6px; }
    .com-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--dim);
      margin-top: 8px;
    }
    .com-meta .skills { color: var(--green); }
    .floor-warn {
      border: 1px solid #ff4444;
      color: #ff4444;
      font-size: 0.72rem;
      padding: 6px 8px;
      margin-top: 8px;
    }
    .under-floor { border-color: #ff4444; }
    .claimed { color: var(--dim); font-size: 0.75rem; margin-top: 8px; }

    /* filter chips */
    .filter-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .fchip {
      font-family: inherit;
      font-size: 0.7rem;
      color: var(--dim);
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 6px 10px;
      min-height: 34px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .fchip.active { color: var(--green); border-color: var(--green); }

    /* member cards */
    .member-head, .member-meta, .rate-line, .member-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.78rem;
      margin-bottom: 6px;
    }
    .member-name { color: var(--green); font-weight: bold; font-size: 0.95rem; }
    .member-level {
      color: var(--gold);
      border: 1px solid var(--gold);
      font-size: 0.65rem;
      padding: 1px 7px;
      text-transform: uppercase;
    }
    .member-meta { color: var(--dim); }
    .phone-flag { color: var(--gold); font-size: 0.7rem; }
    .rate-line { color: var(--dim); }
    .member-stats { color: var(--dim); }
    .detail-btn, .back-btn {
      font-family: inherit;
      font-size: 0.78rem;
      color: var(--green);
      background: var(--bg);
      border: 1px solid var(--green);
      padding: 9px 12px;
      min-height: 42px;
      cursor: pointer;
      margin-top: 8px;
    }
    .back-btn { color: var(--dim); border-color: var(--line); margin-bottom: 12px; }

    /* law view */
    .law-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      padding: 10px 0;
      font-size: 0.85rem;
    }
    .law-row:last-child { border-bottom: none; }
    .law-label { color: var(--text); font-weight: bold; flex: 0 0 130px; }
    .law-price { color: var(--gold); flex: 0 0 160px; }
    .law-blurb { color: var(--dim); flex: 1 1 200px; font-size: 0.78rem; }

    .how-to {
      border-left: 3px solid var(--green);
      font-size: 0.78rem;
      color: var(--dim);
    }
    .how-to b { color: var(--text); }

    .com-list .com-line {
      border-bottom: 1px solid var(--line);
      padding: 8px 0;
      font-size: 0.82rem;
    }
    .com-list .com-line b { color: var(--green); }
    .receipt-line { color: var(--dim); font-size: 0.75rem; margin-top: 3px; }
    .member.detail h2 { color: var(--green); font-size: 1.1rem; margin-bottom: 8px; }

    .err h2 { color: #ff4444; font-size: 1rem; margin-bottom: 6px; }

    .foot {
      text-align: center;
      color: var(--dim);
      font-size: 0.75rem;
      padding: 12px 0 20px;
    }
    .foot a { color: var(--green); text-decoration: none; }
    body.saver * { text-shadow: none !important; box-shadow: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>The Hustle Index</h1>
    <div class="sub">Commission board · member market · rate floor law · 100% of the money goes to the brother who ships</div>
  </header>

  <div id="hustle-nav" aria-label="hustle index views">
    <button type="button" data-view="board" class="active">BOARD</button>
    <button type="button" data-view="market">MARKET</button>
    <button type="button" data-view="law">THE LAW</button>
  </div>

  <main id="hustle-app">
    <div class="card"><p class="brief">loading the board…</p></div>
  </main>

  <div class="foot">
    Hustle Index · part of <a href="../core-system/index.html">the FED-EDU core system</a> ·
    commission shape: commissions_schema.json · floors are law: PRICING.md · undercut = benched
  </div>

  <script src="market-engine.js"></script>
</body>
</html>
