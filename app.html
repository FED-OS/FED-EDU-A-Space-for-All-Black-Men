<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Block — Tabs</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0d1117;
           color: #e6edf3; margin: 0; }
    nav#tabs { display: flex; gap: .25rem; overflow-x: auto; background: #010409;
      border-bottom: 1px solid #30363d; padding: .5rem .75rem; }
    nav#tabs button { white-space: nowrap; color: #8b949e; background: none;
      border: 1px solid transparent; border-radius: 6px; font-size: .85rem;
      padding: .35rem .8rem; cursor: pointer; font-family: inherit; }
    nav#tabs button:hover { color: #e6edf3; background: #161b22; }
    nav#tabs button.active { color: #58a6ff; background: #161b22; border-color: #30363d;
      font-weight: 600; }
    iframe { width: 100%; height: calc(100vh - 3.4rem); border: none; display: block;
      background: #0d1117; }
  </style>
</head>
<body>
  <nav id="tabs" aria-label="Pages">
    <button data-page="index">Home</button>
    <button data-page="hustle-index">Hustle Index</button>
    <button data-page="physical-raffles">Physical Raffles</button>
    <button data-page="prompts">Prompts</button>
    <button data-page="sandbox-blueprints">Sandbox Blueprints</button>
    <button data-page="support-the-block">Support The Block</button>
    <button data-page="urban-dictionary">Urban Dictionary</button>
    <button data-page="wiki">Wiki</button>
    <button data-page="community-boards">Community Boards</button>
    <button data-page="core-system">Core System</button>
    <button data-page="courses-and-guides">Courses &amp; Guides</button>
    <button data-page="discussion">Discussion</button>
    <button data-page="excellence-matrix">Excellence Matrix</button>
    <button data-page="fed-comm-dm">Fed Comm DM</button>
    <button data-page="fedpromptly-coach">FedPromptly Coach</button>
  </nav>
  <iframe id="frame" title="The Block page content" src="index.html"></iframe>
  <script>
    const buttons = Array.from(document.querySelectorAll('#tabs button'));
    const frame = document.getElementById('frame');

    function show(page, updateHash) {
      const btn = buttons.find(b => b.dataset.page === page) || buttons[0];
      buttons.forEach(b => b.classList.toggle('active', b === btn));
      const src = btn.dataset.page + '.html';
      const current = frame.getAttribute('src') || '';
      if (!current.endsWith(src)) frame.src = src;
      if (updateHash) history.replaceState(null, '', '#' + btn.dataset.page);
      document.title = btn.textContent + ' | The Block';
    }

    buttons.forEach(b => b.addEventListener('click', () => show(b.dataset.page, true)));
    show(decodeURIComponent((location.hash || '#index').slice(1)), false);
  </script>
</body>
</html>
